openapi: 3.0.0
info:
  title: Buildings Digitalizer API
  description: |
    # Buildings Digitalizer API
    
    REST API for building image segmentation using ONNX Runtime.
    
    This API provides endpoints to segment building structures from images using deep learning models. 
    The service processes incoming image data through an AI model and returns binary segmentation masks.
    
    ## 🎯 Use Cases
    - Analyze satellite/aerial imagery for building detection
    - Urban planning and development analysis
    - Real estate mapping
    - Infrastructure assessment
    - City mapping projects
    
    ## ✨ Features
    - Image upload via multipart form data
    - Real-time image segmentation with AI models
    - PNG output format for easy integration
    - Concurrent request handling with semaphore control
    - CUDA acceleration support
    - Health check endpoint for monitoring
    - Full OpenAPI/Swagger documentation
    
    ## 🔄 Processing Pipeline
    1. **Input Validation**: Image format and size verification
    2. **Preprocessing**: RGB normalization and tensor conversion
    3. **Inference**: ONNX model inference (with CUDA if available)
    4. **Postprocessing**: Binary thresholding and mask generation
    5. **Encoding**: PNG compression and return
    
    ## 📊 Response Formats
    - **Success**: PNG binary image (grayscale)
      - White (255): Building/segmented area
      - Black (0): Background/non-segmented area
    - **Error**: Plain text error message
    
    ## 🚀 Quick Start
    ```bash
    # Check if API is running
    curl http://localhost:8080/health
    
    # Segment an image
    curl -X POST http://localhost:8080/segment \
      -F "image=@photo.jpg" \
      -o segmentation.png
    
    # Get API specification
    curl http://localhost:8080/api/openapi.json
    ```
  
  version: 0.1.0
  contact:
    name: API Support
    email: support@buildingsdigitalizer.com
    url: https://buildingsdigitalizer.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  
