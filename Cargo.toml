[package]
name = "buildings_digitalizer"
version = "0.1.0"
edition = "2024"

[dependencies]
ort = { version = "2.0.0-rc.11", features = ["ndarray", "cuda"] }
actix-web = "4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
actix-multipart = "0.7.2"
image = "0.25.9"
futures-util = "0.3.31"
ndarray = "0.17.2"
anyhow = "1"
tokio = { version = "^1", features = ["rt-multi-thread", "macros"] }
async-trait = "0.1.89"
