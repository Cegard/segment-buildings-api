[package]
name = "buildings_digitizer"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
ort = { version = "2.0.0-rc.11", features = ["ndarray", "cuda"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = "0.25.9"
futures-util = "0.3.31"
ndarray = "0.17.2"
anyhow = "1"
tokio = { version = "^1", features = ["rt-multi-thread", "macros", "signal"] }
async-trait = "0.1.89"
dotenvy = "0.15"
utoipa = { version = "5.4", features = ["uuid"] }
utoipa-swagger-ui = { version = "9.0", features = ["axum"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
mockall = "0.14"
axum-test = "18.7"
tower = "0.5"
http-body-util = "0.1"
mime = "0.3"

[features]
default = []
cuda = ["ort/cuda"]
